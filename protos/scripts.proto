syntax = "proto3";

option go_package = "github.com/stausee1337/quipt/gen/protos";

package scripts;

enum ScriptErrorCode {
  ID_MALFORMED = 0;
  UNKNOWN_SCRIPT = 1;
  DIVISION_OUT_OF_BOUNDS = 2;
  INVALID_SCORE_DATA = 3;
  INVALID_SCRIPT_NAME = 4;
}

message ScriptError {
  ScriptErrorCode code = 1;
  string message = 2;
}

message Scripts {
  repeated Script scripts = 1;
}

message Script {
  string uuid = 1;
  string name = 2;
  int64 createdAt = 3;
  repeated Division divisions = 4;
}

message Division {
  string name = 1;
  string description = 2;
  repeated uint32 previousTotals = 3;
  repeated TextCuePair textCues = 4;
}

message TextCuePair {
  optional TextCue request = 1;
  TextCue response = 2;
  repeated uint32 previousScores = 3;
}

message TextCue {
  repeated string actors = 1;
  string text = 2;
}

message DivisionScoreUpdate { 
  string scriptId = 1;
  uint32 divisionIdx = 2;
  repeated uint32 newScores = 3;
}

message ScriptNameUpdate {
  string scriptId = 1;
  string newName = 2;
}

