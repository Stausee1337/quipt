events {
    worker_connections    1024;
}

http {
    server {
        listen 80;
        server_name     *.quipt.app;
        rewrite ^ https://$host$request_uri? permanent;
    }

    server {
        listen          443 ssl default_server;

        ssl_protocols   TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_ciphers     ALL:!aNULL:!ADH:!eNULL:!LOW:!EXP:RC4+RSA:+HIGH:+MEDIUM;

        server_name     quipt.app;

        access_log      /var/log/nginx/access.log;
        error_log       /var/log/nginx/error.log info;

        keepalive_timeout    75 75;

        # ssl             on;
        ssl_certificate        /etc/ssl/quipt.app-letsencrypt.crt; 
        ssl_certificate_key    /etc/ssl/quipt.app-letsencrypt.key;
        ssl_session_timeout    5m;

        add_header  Strirct-Transport-Security "max-age=7200";

        root        /usr/share/nginx/html;
        include     /etc/nginx/mime.types;

        location / {
            # error_page  404 /404.html;
            # index       index.html;
            try_files   $uri $uri/ /index.html;
        }
    }

    server {
        listen            443 ssl;

        ssl_protocols   TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
        ssl_ciphers     ALL:!aNULL:!ADH:!eNULL:!LOW:!EXP:RC4+RSA:+HIGH:+MEDIUM;

        server_name     api.quipt.app;

        access_log      /var/log/nginx/access.log;
        error_log       /var/log/nginx/error.log info;

        keepalive_timeout    75 75;

        # ssl             on;
        ssl_certificate         /etc/ssl/api.quipt.app-letsencrypt.crt; 
        ssl_certificate_key     /etc/ssl/api.quipt.app-letsencrypt.key;
        ssl_session_timeout     5m;

        add_header        Strirct-Transport-Security "max-age=7200";

        root        /usr/share/nginx/static;
        include     /etc/nginx/mime.types;

        location / {
            # rewrite /api/(.*) /$1 break;
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
        }
    }
}
