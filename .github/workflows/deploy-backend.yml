name: Create and Publish Go Server Docker Image

on:
  push:
    branches:
      - trunk

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3
      
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: stausee1337
          password: ${{ secrets.GITHUB_TOKEN }}
      
      # Build & push Docker image
      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/stausee1337/quipt-backend:latest

